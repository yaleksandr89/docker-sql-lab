name: Bug report / Сообщить об ошибке
description: Report a reproducible problem with SQL Lab / Сообщить о воспроизводимой проблеме стенда SQL Lab
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. / Спасибо, что нашли время сообщить о проблеме.

        Use synthetic data only. Do not publish passwords, tokens, local or production configurations, real data, or vulnerability details. For security issues use the [security policy](https://github.com/yaleksandr89/docker-sql-lab/security/policy). / Используйте только синтетические данные. Не публикуйте пароли, токены, локальные или production-конфигурации, реальные данные и подробности уязвимостей. Для уязвимостей используйте [политику безопасности](https://github.com/yaleksandr89/docker-sql-lab/security/policy).

  - type: textarea
    id: summary
    attributes:
      label: Summary / Краткое описание
      description: What happened? / Что произошло?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / Шаги для воспроизведения
      description: Describe the smallest sequence that reproduces the problem. / Опишите минимальную последовательность действий для воспроизведения проблемы.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result / Ожидаемый результат
      description: What did you expect to happen? / Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result / Фактический результат
      description: What happened instead? / Что произошло на самом деле?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / Окружение
      description: Include release or commit, OS, Docker/Compose and MySQL/PostgreSQL/Adminer versions, selected DBMS, Adminer mode, optional dataset and browser if relevant. / Укажите релиз или коммит, ОС, версии Docker/Compose и MySQL/PostgreSQL/Adminer, выбранную СУБД, режим Adminer, опциональный набор данных и браузер, если применимо.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or additional context / Очищенные логи или дополнительный контекст
      description: Remove secrets, actual data, sensitive paths, internal names and vulnerability details. / Удалите секреты, реальные данные, чувствительные пути, внутренние имена и подробности уязвимостей.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: I can reproduce the problem on the latest `master` or the latest release. / Я могу воспроизвести проблему на последней версии `master` или последнем релизе.
          required: true
        - label: I searched existing Issues for the same problem. / Я проверил(а) существующие Issues на наличие такой проблемы.
          required: true
