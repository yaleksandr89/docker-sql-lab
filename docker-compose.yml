services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT}:3306"
    volumes:
      - "${MYSQL_DATA_DIR}:/var/lib/mysql"
      - "${MYSQL_CONF_FILE}:/etc/mysql/conf.d/sql-lab.cnf:ro"
      - "${MYSQL_INITDB_DIR}:/docker-entrypoint-initdb.d:ro"
      - "${MYSQL_SAMPLES_DIR}:/opt/mysql-samples:ro"
    healthcheck:
      test: 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - "${POSTGRES_DATA_DIR}:/var/lib/postgresql"
      - "${POSTGRES_INITDB_DIR}:/docker-entrypoint-initdb.d:ro"
      - "${POSTGRES_SAMPLES_DIR}:/opt/postgres-samples:ro"
    healthcheck:
      test: 'pg_isready --host=127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse:${CLICKHOUSE_VERSION}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT}:8123"
    volumes:
      - "${CLICKHOUSE_DATA_DIR}:/var/lib/clickhouse"
      - "${CLICKHOUSE_INITDB_DIR}:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: 'test "$$(cat /proc/1/comm)" = clickhouse-serv && wget --quiet --output-document=/dev/null --header="X-ClickHouse-User: $${DB_USER}" --header="X-ClickHouse-Key: $${DB_PASSWORD}" --post-data="SELECT 1" http://127.0.0.1:8123/'
      interval: 5s
      timeout: 3s
      retries: 60

  adminer:
    image: adminer:${ADMINER_VERSION}
    restart: unless-stopped
    profiles:
      - ui
    environment:
      ADMINER_DESIGN: nette
      TZ: Europe/Moscow
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT}:8080"
    volumes:
      - "./adminer/plugins-enabled/001-login-servers.php:/var/www/html/plugins-enabled/001-login-servers.php:ro"
      - "./adminer/plugins-enabled/002-login-help.php:/var/www/html/plugins-enabled/002-login-help.php:ro"

